# Configuracion de Supabase CLI local. La usa `pnpm db:reset` (Checkpoint 0).
#
# Solo se define lo que el MVP necesita. Auth, storage y realtime se dejan en sus
# valores por defecto: anadir aqui opciones que el MVP no usa es documentacion que
# puede quedarse desfasada sin que nadie lo note.

project_id = "padel-template"

[db]
# Puerto 54322 en local. El test de RLS (T3) conecta aqui.
port = 54322
# El test necesita crear y tirar bases, y `supabase db reset` borra el cluster.
major_version = 17

[db.seed]
# `supabase db reset` lo aplica siempre, antes de los tests.
enabled = true
sql_paths = ["./seed.sql"]

[auth]
# El JWT lleva `tenant_id` como claim. Sin esto, `current_tenant_id()` no tiene de
# donde sacarlo y toda politica devolveria 0 filas.
jwt_expiry = 3600
enable_signup = false

[auth.email]
# El OTP local imprime el enlace en consola. Para desarrollo es lo mas comodo.
enable_signup = false
enable_confirmations = false

[studio]
enabled = true
port = 54323

# Sin seccion de SMTP local a proposito. La 2.118.0 avisa de que `[inbucket]` esta
# obsoleta y pide `[local_smtp]`; en vez de adivinar los campos de la nueva seccion
# se omite, porque el MVP no necesita SMTP para nada y anadirla aqui es documentacion
# que puede quedarse desfasada. Cuando T16 mande correos en local, se anade entonces
# con los campos que pida la CLI de esa version.
